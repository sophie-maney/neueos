[package]
name = "neue-comp"
description = "neueOS Wayland compositor (Linux only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neue-comp"
path = "src/main.rs"

[features]
default = ["winit", "tty"]
# Nested backend for development. Smithay's winit backend force-enables winit's `x11`
# feature, which pulls in X11 client crates (never used at runtime: winit picks Wayland
# when WAYLAND_DISPLAY is set). Release/distro builds use `--no-default-features` so the
# shipped binary contains no X11 code. See ADR 0001 ("winit backend and X11 crates").
winit = ["smithay/backend_winit"]
# The real backend: DRM/KMS, GBM, libinput, udev and libseat (task 1.4, ADR 0001). Links
# libinput, libudev, libseat and libgbm, so headless-only builds can leave it out.
tty = [
    "dep:xcursor",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
]

[dependencies]
anyhow.workspace = true
neue-config.workspace = true
neue-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
neue-paint.workspace = true
rustix.workspace = true
xcursor = { workspace = true, optional = true }
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_egl",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-misc.workspace = true
wayland-protocols-wlr.workspace = true

[lints]
workspace = true
