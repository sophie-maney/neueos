name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Compositor tests block on Wayland roundtrips; don't let a hang burn hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            os: macos-15
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The toolchain version is pinned in rust-toolchain.toml (single source of truth).
      # rustup >= 1.28 no longer installs it implicitly, so do it explicitly.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # C libraries neue-comp links (xkbcommon; libinput, libudev, libseat and libgbm for
      # the tty backend), plus what the headless tests dlopen: libwayland-client for the
      # scripted clients, and Mesa's EGL with its software device (llvmpipe) for the render
      # tests (docs/dev-setup.md §1.2, ADR 0021), with libwayland-egl for neue-platform's
      # driver test (wgpu's GL backend on Wayland, ADR 0033). libpipewire's headers and
      # libclang for pipewire-rs's bindgen (neue-audio, ADR 0087).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libwayland-client0 libwayland-egl1
          libinput-dev libudev-dev libseat-dev libgbm-dev
          libegl1 libegl-mesa0 libgl1-mesa-dri
          libpipewire-0.3-dev libclang-dev

      - name: cargo xtask check
        run: cargo xtask check
