[package]
name = "neue-platform"
description = "Windowing drivers for neueOS's toolkit: Wayland (smithay-client-toolkit) and winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Portable crate: the Wayland driver is Linux-only and the winit driver macOS-only (ADR 0002
# §4, ADR 0032), both cfg-gated. winit stays off Linux: `ui-events-winit` turns on winit's
# default features, which include X11.
[dependencies]
masonry_core.workspace = true
masonry_imaging.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_winit.workspace = true
arboard.workspace = true
ui-events-winit.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix.workspace = true
raw-window-handle.workspace = true
smithay-client-toolkit.workspace = true
wayland-backend = { workspace = true, features = ["client_system", "dlopen"] }
wayland-client.workspace = true
wayland-protocols.workspace = true

[dev-dependencies]
anyhow.workspace = true
masonry.workspace = true
neue-paint = { workspace = true, features = ["imaging"] }
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-protocols-misc.workspace = true

[lints]
workspace = true
