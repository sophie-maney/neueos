[package]
name = "neue-dbus"
description = "neueOS's D-Bus interfaces on zbus: DBusMenu export (and later clients and services)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Linux-only (AGENTS.md platform matrix: anything using D-Bus); listed in xtask's
# LINUX_ONLY_CRATES. neue-kit depends on it on Linux only.
[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `p2p` for `neue_dbus::testing` (connections without a bus daemon); it only adds uuid.
zbus = { workspace = true, features = ["p2p"] }

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
