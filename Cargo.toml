[workspace]
resolver = "3"
members = ["crates/*", "compositor/*", "session/neue-session", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/sophie-maney/neueos"
publish = false

# Shared dependency versions. Member crates use `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# Rendering. vello_cpu/vello_gpu ship breaking releases every 1-2 months, so pin exactly
# (docs/research/vello-cpu.md).
vello_common = "=0.3.0"
vello_cpu = { version = "=0.3.0", features = ["f32_pipeline"] }
vello_gpu = "=0.3.0"
wgpu = "30.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
pollster = "1.0"

# Compositor. Pinned git rev per ADR 0001; bump in its own PR. Features are chosen per crate;
# never enable `xwayland`, `backend_x11` or `x11rb_event_source`. The rev is upstream main
# `c7a26ad` plus one popup fix on our fork's `neueos` branch (ADR 0029, bug B5).
smithay = { git = "https://github.com/sophie-maney/smithay", rev = "32e0137157a5419733bf655436973c1feb6503ec", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# XCursor theme parser (pure Rust, MIT, task 1.9, ADR 0012). Already in the tree via winit.
xcursor = "0.3"
# Scripted Wayland test clients (neue-comp's headless tests). Versions match Smithay's.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs"] }
# Hand-generated protocols (neue-protocols, ADR 0025). Versions match Smithay's.
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-protocols-plasma = "0.3"

# Wayland client toolkit for neue-platform's driver (task 2.2). `system` uses libwayland-client
# (dlopen'd, as winit already does) because wgpu needs a `wl_display*`; `xkbcommon` is the
# libxkbcommon ADR 0001 already accepts.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon", "system"] }
raw-window-handle = "0.6"

# neue-platform's winit driver (task 2.4, ADR 0032), macOS only: `ui-events-winit` turns on
# winit's default features (X11 on Linux), and arboard's Linux backend is X11. Versions match
# the Masonry fork's `masonry_winit`. All MIT OR Apache-2.0.
accesskit_winit = { version = "0.34.2", default-features = false, features = ["rwh_06"] }
ui-events-winit = { version = "0.3.0", default-features = false }
arboard = { version = "3.6", default-features = false }
# neue-platform's Wayland driver (task 2.6, ADR 0034): AccessKit over AT-SPI. Pure Rust
# (zbus), MIT OR Apache-2.0; already in Cargo.lock through accesskit_winit.
accesskit_unix = "0.24.1"

# IPC (neue-ipc, neuectl)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
tempfile = "3"

# Configuration (neue-config, ADR 0004). `toml` is MIT OR Apache-2.0.
toml = "1"

# Text layout for neue-paint (ADR 0002). No `system` feature: fonts are bundled, so no
# fontconfig and identical output on every host (ADR 0013).
parley = { version = "0.12", default-features = false, features = ["std"] }

# Widget tree (ADR 0002 §4, ADR 0030). Our fork's `neueos` branch: upstream main `dc49687`
# plus linebender/xilem#1864 (parley 0.12, accesskit 0.25), `imaging` at the git rev below
# (vello_cpu/vello_gpu 0.3, wgpu 30) and no C dependencies. See
# docs/research/masonry-spike.md. Bump in its own PR. `imaging` is pre-alpha and
# unreleased; pin the same rev the fork uses.
masonry_core = { git = "https://github.com/sophie-maney/xilem", rev = "499f423522bc7fe8ed36816683b2cc6d14a86d97" }
masonry_testing = { git = "https://github.com/sophie-maney/xilem", rev = "499f423522bc7fe8ed36816683b2cc6d14a86d97", default-features = false }
# Spike only (ADR 0002 §4): replaced by neue-platform's own driver in task 2.4. Uses
# vello_gpu through imaging_vello_hybrid, never vello's compute renderer.
masonry_winit = { git = "https://github.com/sophie-maney/xilem", rev = "499f423522bc7fe8ed36816683b2cc6d14a86d97", default-features = false, features = ["imaging_vello_hybrid"] }
# Renders Masonry's paint output with vello_gpu (`imaging_vello_hybrid`) into a wgpu texture.
# neue-platform's drivers use it (task 2.2, ADR 0002 amendment).
masonry_imaging = { git = "https://github.com/sophie-maney/xilem", rev = "499f423522bc7fe8ed36816683b2cc6d14a86d97", default-features = false, features = ["imaging_vello_hybrid"] }
# Masonry's stock widgets. Spike examples only (task 2.2: `TextInput`, `Selector`); never a
# dependency of library or app crates (ADR 0002 §4).
masonry = { git = "https://github.com/sophie-maney/xilem", rev = "499f423522bc7fe8ed36816683b2cc6d14a86d97", default-features = false }
imaging = { git = "https://github.com/forest-rs/imaging", rev = "f3f932a8a0e233f5ab52863041b8a3d6cff9255b", default-features = false, features = ["std"] }

# Colour type shared with peniko (`peniko::Color` is `color::AlphaColor<Srgb>`); neue-theme
# uses it directly. Must match the version peniko depends on. MIT OR Apache-2.0.
color = { version = "0.3.3", default-features = false, features = ["std"] }

# Internal crates
neue-paint = { path = "crates/neue-paint" }
neue-theme = { path = "crates/neue-theme" }
neue-ipc = { path = "crates/neue-ipc" }
neue-config = { path = "crates/neue-config" }
neue-protocols = { path = "crates/neue-protocols" }
neue-platform = { path = "crates/neue-platform" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# No unwrap/expect in non-test code (see AGENTS.md). Tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
