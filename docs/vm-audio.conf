# PipeWire test devices for the VM (docs/dev-setup.md §1.6e, task 3.14b): the VM's sound
# card belongs to the seat, which the greeter holds, so PipeWire would see no devices.
# Copy to ~/.config/pipewire/pipewire.conf.d/ and restart pipewire and wireplumber.
context.objects = [
  { factory = adapter
    args = { factory.name = support.null-audio-sink node.name = "neue-test-sink"
             node.description = "Test Output" media.class = Audio/Sink
             object.linger = true audio.position = [ FL FR ] monitor.channel-volumes = true } }
  { factory = adapter
    args = { factory.name = support.null-audio-sink node.name = "neue-test-sink-2"
             node.description = "Test Headphones" media.class = Audio/Sink
             object.linger = true audio.position = [ FL FR ] monitor.channel-volumes = true } }
  { factory = adapter
    args = { factory.name = support.null-audio-sink node.name = "neue-test-source"
             node.description = "Test Input" media.class = Audio/Source/Virtual
             object.linger = true audio.position = [ FL FR ] } }
]
